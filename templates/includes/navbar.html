{% load static %}
<header class="nav" id="mainNavbar">
  <div class="wrap nav__inner">
    <!-- Brand Logo -->
    <a href="{% url 'website:home' %}" class="logo">
      {% if site_settings.logo %}
        <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.site_name }}" style="height: 38px;">
      {% else %}
        <div class="logo__mark">⚡</div>
        <span>BLADE<span class="logo__accent">STICKERS</span></span>
      {% endif %}
    </a>

    <!-- Desktop Nav Links -->
    <nav class="nav__links" id="navLinks">
      <a href="{% url 'website:home' %}" class="nav__link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
      <a href="{% url 'products:gallery' %}" class="nav__link {% if request.resolver_match.url_name == 'gallery' or request.resolver_match.url_name == 'product_detail' %}active{% endif %}">Collection</a>
      <a href="{% url 'website:about' %}" class="nav__link {% if request.resolver_match.url_name == 'about' %}active{% endif %}">About</a>
      <a href="{% url 'contact:contact' %}" class="nav__link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}">Contact</a>
    </nav>

    <!-- Nav Right / CTAs -->
    <div class="nav__right">
      <a href="https://wa.me/{{ site_settings.whatsapp_number }}?text=Hi%20Blade%20Stickers!%20I%20want%20to%20place%20an%20order" target="_blank" class="btn btn--fill btn--sm nav__cta">
        Order Now 🚀
      </a>

      <!-- Mobile Hamburger Button -->
      <button class="burger" id="mobileToggle" aria-label="Toggle navigation menu" aria-expanded="false">
        ☰
      </button>
    </div>
  </div>

  <!-- Mobile Fullscreen Overlay -->
  <div class="mob-nav" id="mobileMenu">
    <a href="{% url 'website:home' %}" class="mob-nav__link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
    <a href="{% url 'products:gallery' %}" class="mob-nav__link {% if request.resolver_match.url_name == 'gallery' or request.resolver_match.url_name == 'product_detail' %}active{% endif %}">Collection</a>
    <a href="{% url 'website:about' %}" class="mob-nav__link {% if request.resolver_match.url_name == 'about' %}active{% endif %}">About Us</a>
    <a href="{% url 'contact:contact' %}" class="mob-nav__link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}">Contact & Order</a>

    <div class="mob-nav__cta">
      <a href="https://wa.me/{{ site_settings.whatsapp_number }}?text=Hi%20Blade%20Stickers!%20I%20want%20to%20place%20an%20order" target="_blank" class="btn btn--fill" style="width: 100%;">
        Order on WhatsApp 💬
      </a>
    </div>
  </div>
</header>
